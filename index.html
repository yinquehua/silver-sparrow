<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>审神者派遣 · 现世远征许可资格认证</title>
  <style>
    /* ============================================================
       全局重置与基础样式 —— 手机优先，米白色调查问卷风格
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #e8e2d8; /* 米白底色 */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      padding: 12px;
      color: #3a342e;
    }

    /* 主游戏容器：竖屏自适应卡片，米白纸感 */
    .game-container {
      width: 100%;
      max-width: 430px;
      background: #faf6ef; /* 更浅的米白 */
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(100, 85, 70, 0.15), 0 0 0 1px rgba(140, 120, 100, 0.12);
      padding: 22px 20px 26px;
      display: flex;
      flex-direction: column;
      min-height: 560px;
      position: relative;
      border: 1px solid #e0d8cc;
    }

    /* 纸张纹理感的顶部装饰线 */
    .game-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 16px;
      right: 16px;
      height: 3px;
      background: linear-gradient(90deg, #c9b8a4, #b8a690, #c9b8a4);
      border-radius: 0 0 3px 3px;
      opacity: 0.6;
    }

    /* 屏幕通用区域 */
    .screen {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* 标题样式 */
    .title-main {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-align: center;
      color: #4a3f36;
      margin: 28px 0 8px;
      line-height: 1.4;
    }

    .title-main .small-caps {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 4px;
      color: #9a8a7a;
      margin-bottom: 14px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .title-sub {
      font-size: 0.88rem;
      text-align: center;
      color: #8a7a6a;
      letter-spacing: 2px;
      margin-bottom: 30px;
      border-top: 1px solid #ddd4c6;
      padding-top: 16px;
      line-height: 1.7;
    }

    /* 故事 / 问题 文本区域 */
    .story-text {
      font-size: 1rem;
      line-height: 1.7;
      color: #4a4038;
      text-align: left;
      margin: 8px 0 18px;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .story-text p {
      margin-bottom: 0.85em;
    }

    .story-text p:last-child {
      margin-bottom: 0;
    }

    /* 问题序号标记 —— 调查问卷样式 */
    .q-index {
      display: inline-block;
      font-size: 0.78rem;
      background: #e6ddd0;
      color: #7a6a58;
      padding: 4px 14px;
      border-radius: 14px;
      margin-bottom: 12px;
      letter-spacing: 1px;
      font-weight: 600;
      align-self: flex-start;
      border: 1px solid #d8cdc0;
    }

    /* 主办方落款/机构名 */
    .org-name {
      font-size: 0.72rem;
      color: #a09080;
      letter-spacing: 1px;
      text-align: center;
      margin-top: 10px;
      font-weight: 400;
    }

    /* 按钮容器 */
    .buttons-area {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 12px;
    }

    /* 通用按钮 —— 高度≥48px，字号≥16px，调查问卷选项样式 */
    button {
      width: 100%;
      min-height: 54px;
      padding: 13px 16px;
      background: #f5f0e8;
      border: 1.5px solid #d8cdc0;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 500;
      color: #4a4038;
      text-align: left;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      box-shadow: 0 2px 6px rgba(140, 120, 100, 0.08);
      outline: none;
      font-family: inherit;
      line-height: 1.45;
      display: flex;
      align-items: center;
      position: relative;
    }

    /* 按钮内选项标签 (A/B/C/D) —— 圆圈样式 */
    button span.opt-tag {
      display: inline-block;
      background: #e6ddd0;
      color: #6a5a48;
      font-size: 0.85rem;
      font-weight: 700;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      text-align: center;
      line-height: 28px;
      margin-right: 12px;
      flex-shrink: 0;
      border: 1.5px solid #d0c4b4;
      transition: background 0.15s, border-color 0.15s;
    }

    button:active {
      background: #e8e0d4;
      border-color: #b8a690;
      transform: scale(0.985);
    }

    button:active span.opt-tag {
      background: #d0c4b4;
      border-color: #b8a690;
    }

    /* 特殊按钮：居中 */
    .btn-center {
      justify-content: center;
      text-align: center;
      font-weight: 600;
      letter-spacing: 2px;
    }

    /* 重新开始按钮特殊样式 */
    .restart-btn {
      background: #ede5d8;
      border-color: #c8b8a4;
      color: #5a4a3a;
      margin-top: 8px;
    }

    .restart-btn:active {
      background: #ddd0c0;
    }

    /* 回退按钮 —— 次级样式 */
    .btn-back {
      background: #f0ebe3;
      border-color: #d8cdc0;
      color: #8a7a6a;
      font-weight: 500;
      letter-spacing: 1px;
      font-size: 0.9rem;
      min-height: 48px;
      justify-content: center;
      text-align: center;
      border-style: dashed;
    }

    .btn-back:active {
      background: #e8e0d4;
      border-color: #b8a690;
    }

    /* 输入框样式 —— 调查问卷填空样式 */
    .input-area {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 10px 0 18px;
      flex: 1;
      justify-content: center;
    }

    .input-label {
      font-size: 1rem;
      color: #6a5a4a;
      letter-spacing: 1px;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .text-input {
      width: 100%;
      min-height: 58px;
      padding: 14px 20px;
      background: #fffdf9;
      border: 1.5px solid #d0c4b4;
      border-radius: 12px;
      font-size: 1.1rem;
      color: #3a342e;
      outline: none;
      font-family: inherit;
      letter-spacing: 1px;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: inset 0 1px 4px rgba(160, 140, 120, 0.08);
    }

    .text-input:focus {
      border-color: #b8a690;
      box-shadow: inset 0 1px 4px rgba(160, 140, 120, 0.12), 0 0 0 3px rgba(180, 160, 140, 0.15);
    }

    .text-input::placeholder {
      color: #b8a898;
      font-size: 0.95rem;
    }

    /* 结局标题 */
    .ending-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #4a3f36;
      text-align: center;
      margin: 12px 0 6px;
      letter-spacing: 2px;
      line-height: 1.35;
    }

    .ending-sub {
      text-align: center;
      color: #8a7a6a;
      font-size: 0.82rem;
      margin-bottom: 20px;
      letter-spacing: 2px;
      border-bottom: 1px dashed #d0c4b4;
      padding-bottom: 14px;
    }

    /* 认证标签（装饰） */
    .cert-badge {
      font-size: 0.7rem;
      color: #a09080;
      letter-spacing: 1px;
      text-align: center;
      margin-top: 8px;
      opacity: 0.9;
      line-height: 1.6;
    }

    /* 分数徽章（结局页显示） */
    .score-badge {
      display: inline-block;
      background: #ede5d8;
      color: #6a5a48;
      font-size: 0.75rem;
      padding: 3px 12px;
      border-radius: 12px;
      margin-top: 4px;
      letter-spacing: 1px;
      border: 1px solid #d8cdc0;
    }

    /* 问卷分隔线 */
    .divider {
      height: 1px;
      background: #e0d8cc;
      margin: 12px 0 16px;
      border: none;
    }

    /* 适配小屏幕高度 */
    @media (max-height: 700px) {
      .game-container {
        padding: 14px 14px 18px;
        min-height: 480px;
      }
      .title-main {
        font-size: 1.3rem;
        margin-top: 14px;
      }
      .story-text {
        font-size: 0.92rem;
        margin: 6px 0 14px;
      }
      button {
        min-height: 48px;
        font-size: 0.92rem;
        padding: 10px 14px;
      }
      .ending-title {
        font-size: 1.25rem;
      }
      .text-input {
        min-height: 50px;
        font-size: 1rem;
      }
      button span.opt-tag {
        width: 26px;
        height: 26px;
        line-height: 26px;
        font-size: 0.8rem;
      }
    }

    /* 滚动条隐藏但保留滚动功能 */
    .story-text::-webkit-scrollbar {
      width: 0;
      background: transparent;
    }

    /* 选项按钮禁用态（用于显示历史选择，本游戏未使用但保留） */
    button.disabled {
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>

        paragraphs: [
          '「代号」大人，恭喜您。',
          '经时之政府远征事务处理办公室综合评定，您的决策能力、应变意识与对刀剑男士的管理理念均达到优秀标准。',
          '“您具备独自带队在现世执行远征任务的资格。”',
          '现世远征许可已正式发放至您的审神者终端。',
          '—— 愿您与您的刀剑男士，在现世武运昌隆。'
        ]
      }
    };

    // 主办方名称
    const ORG_NAME = '时之政府远征事务处理办公室';

    // 获取容器
    const container = document.getElementById('gameContainer');

    // --------------------------------------------------------------
    // 辅助函数：根据总分返回结局键名
    // 总分范围 -10 到 20
    // --------------------------------------------------------------
    function getEndingKey(score) {
      if (score <= 0) return 'A';       // -10 ~ 0   不予通过
      if (score <= 11) return 'B';      // 0 ~ 11    冷却期后重新申请（注：0分归入B？但要求A是-10到0，B是0到11，0同时属于两个区间。按照题目要求A是-10到0分，B是0-11分，这里处理为0分归入A更符合"不予通过"的严厉性？但题干写的是-10到0，0-11，有重叠。按照常理0分应该归入A，但为严谨，我们以题干为准：A是-10到0，B是0-11，那么0分同时满足。实际处理取A，因为A覆盖到0，B从0开始，但通常区间取左闭右开。这里为保险，让0分归入A「不予通过」更合理？但用户明确写了"A「不予通过！」：-10到0分"和"B「请您冷却期过后重新申请」：0-11分"，存在重叠。我们按更严格的标准，把0分归入A，即score<=0为A，score>0为B。这样0分不予通过。）
      if (score <= 16) return 'C';      // 12 ~ 16  考试场参与申请（11到12之间取整，12-16）
      return 'D';                        // 17 ~ 20  批准通过
    }

    // 重新计算总分（用于回退后重新统计）
    function recalcTotalScore() {
      let sum = 0;
      for (let i = 0; i < answers.length; i++) {
        if (answers[i] !== null) {
          sum += answers[i];
        }
      }
      totalScore = sum;
    }

    // --------------------------------------------------------------
    // 重置游戏
    // --------------------------------------------------------------
    function resetGame() {
      playerName = '审神者';
      totalScore = 0;
      currentNode = 'title';
      currentQuestionIndex = 1;
      answers = new Array(10).fill(null);
      render();
    }

    // --------------------------------------------------------------
    // 处理选项点击（记录答案并进入下一题）
    // --------------------------------------------------------------
    function handleOptionClick(score) {
      // 记录当前题目的答案（用索引 currentQuestionIndex-1）
      answers[currentQuestionIndex - 1] = score;
      // 重新计算总分
      recalcTotalScore();

      // 判断是否还有下一题
      if (currentQuestionIndex >= 10) {
        // 所有问题答完，进入结局
        currentNode = 'ending';
      } else {
        // 进入下一题
        currentQuestionIndex++;
        currentNode = 'q' + currentQuestionIndex;
      }
      render();
    }

    // --------------------------------------------------------------
    // 回退到上一题
    // --------------------------------------------------------------
    function goBack() {
      if (currentQuestionIndex > 1) {
        // 清除当前题的答案（回退后重新作答）
        answers[currentQuestionIndex - 1] = null;
        // 索引减一，回到上一题
        currentQuestionIndex--;
        currentNode = 'q' + currentQuestionIndex;
        // 重新计算总分（因为清除了当前题答案）
        recalcTotalScore();
        render();
      } else {
        // 如果已经是第一题，回退到输入页？或者保持不动？
        // 这里选择回退到输入页之前？但为了简单，如果是第一题就不回退，或者回到输入页。
        // 根据流程，输入页之后是问题1，如果从问题1回退，可以回到输入页。
        // 但输入页需要重新输入代号。我们允许回到输入页。
        if (currentQuestionIndex === 1) {
          // 清除第一题答案
          answers[0] = null;
          recalcTotalScore();
          currentNode = 'input';
          render();
        }
      }
    }

    // --------------------------------------------------------------
    // 渲染主入口
    // --------------------------------------------------------------
    function render() {
      const node = currentNode;
      container.innerHTML = '';

      if (node === 'title') {
        renderTitleScreen();
      } else if (node === 'opening') {
        renderOpeningScreen();
      } else if (node === 'input') {
        renderInputScreen();
      } else if (node.startsWith('q')) {
        const qNum = parseInt(node.substring(1), 10);
        renderQuestionScreen(qNum);
      } else if (node === 'ending') {
        renderEndingScreen();
      } else {
        renderTitleScreen();
      }
    }

    // --------------------------------------------------------------
    // 渲染：标题页
    // --------------------------------------------------------------
    function renderTitleScreen() {
      const screenDiv = document.createElement('div');
      screenDiv.className = 'screen';

      const title = document.createElement('div');
      title.className = 'title-main';
      title.innerHTML = `
        <span class="small-caps">${ORG_NAME}</span>
        现世远征<br>许可资格认证
      `;

      const sub = document.createElement('div');
      sub.className = 'title-sub';
      sub.textContent = '—— 资质评估 · 十问问卷 ——';

      const btnArea = document.createElement('div');
      btnArea.className = 'buttons-area';

      const startBtn = document.createElement('button');
      startBtn.className = 'btn-center';
      startBtn.textContent = '开始认证';
      startBtn.addEventListener('click', () => {
        currentNode = 'opening';
        totalScore = 0;
        currentQuestionIndex = 1;
        answers = new Array(10).fill(null);
        render();
      });

      btnArea.appendChild(startBtn);

      const badge = document.createElement('div');
      badge.className = 'cert-badge';
      badge.innerHTML = `认证编号 · 现世-10-审神者<br>${ORG_NAME}`;

      screenDiv.appendChild(title);
      screenDiv.appendChild(sub);
      screenDiv.appendChild(btnArea);
      screenDiv.appendChild(badge);
      container.appendChild(screenDiv);
    }

    // --------------------------------------------------------------
    // 渲染：开场文字
    // --------------------------------------------------------------
    function renderOpeningScreen() {
      const screenDiv = document.createElement('div');
      screenDiv.className = 'screen';

      const textDiv = document.createElement('div');
      textDiv.className = 'story-text';

      const lines = [
        '『现世远征许可资格认证』',
        `—— ${ORG_NAME} ——`,
        '',
        '本次认证旨在评估审神者是否具备在现世环境中',
        '管理刀剑男士、应对突发状况、以及协调各方关系的能力。',
        '',
        '问卷共十题，请根据您的真实判断作答。',
        '系统将根据您的综合评分，决定是否授予现世远征许可。',
        '',
        '在开始之前，请先登记您的代号。'
      ];

      lines.forEach(line => {
        const p = document.createElement('p');
        if (line === '') {
          p.innerHTML = '&nbsp;';
        } else {
          p.textContent = line;
        }
        textDiv.appendChild(p);
      });

      const btnArea = document.createElement('div');
      btnArea.className = 'buttons-area';

      const nextBtn = document.createElement('button');
      nextBtn.className = 'btn-center';
      nextBtn.textContent = '登记代号';
      nextBtn.addEventListener('click', () => {
        currentNode = 'input';
        render();
      });

      btnArea.appendChild(nextBtn);
      screenDiv.appendChild(textDiv);
      screenDiv.appendChild(btnArea);
      container.appendChild(screenDiv);
    }

    // --------------------------------------------------------------
    // 渲染：输入页（自由输入代号）
    // --------------------------------------------------------------
    function renderInputScreen() {
      const screenDiv = document.createElement('div');
      screenDiv.className = 'screen';

      const textDiv = document.createElement('div');
      textDiv.className = 'story-text';
      textDiv.style.justifyContent = 'flex-start';
      textDiv.style.paddingTop = '16px';

      const introP = document.createElement('p');
      introP.textContent = '请输入代号。';
      introP.style.fontWeight = '600';
      introP.style.color = '#4a3f36';
      introP.style.fontSize = '1.1rem';
      textDiv.appendChild(introP);

      const hintP = document.createElement('p');
      hintP.textContent = '此代号将用于本次认证及后续所有正式场合。';
      hintP.style.fontSize = '0.85rem';
      hintP.style.color = '#9a8a7a';
      textDiv.appendChild(hintP);

      // 输入区域
      const inputArea = document.createElement('div');
      inputArea.className = 'input-area';

      const label = document.createElement('div');
      label.className = 'input-label';
      label.textContent = '代号：';

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'text-input';
      input.placeholder = '例如：朝雾、三日月、某审……';
      input.maxLength = 20;
      input.id = 'playerNameInput';

      inputArea.appendChild(label);
      inputArea.appendChild(input);

      // 按钮区域
      const btnArea = document.createElement('div');
      btnArea.className = 'buttons-area';

      const confirmBtn = document.createElement('button');
      confirmBtn.className = 'btn-center';
      confirmBtn.textContent = '确认代号';
      confirmBtn.addEventListener('click', () => {
        const inputEl = document.getElementById('playerNameInput');
        let val = inputEl ? inputEl.value.trim() : '';
        if (val === '') {
          val = '审神者';
        }
        playerName = val;
        // 重置答题状态
        answers = new Array(10).fill(null);
        totalScore = 0;
        currentQuestionIndex = 1;
        // 进入第一题
        currentNode = 'q1';
        render();
      });

      // 回车确认
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          confirmBtn.click();
        }
      });

      btnArea.appendChild(confirmBtn);

      screenDiv.appendChild(textDiv);
      screenDiv.appendChild(inputArea);
      screenDiv.appendChild(btnArea);
      container.appendChild(screenDiv);

      // 自动聚焦
      setTimeout(() => {
        const inputEl = document.getElementById('playerNameInput');
        if (inputEl) inputEl.focus();
      }, 100);
    }

    // --------------------------------------------------------------
    // 渲染：问题界面 (q1 ~ q10)
    // --------------------------------------------------------------
    function renderQuestionScreen(qNum) {
      const screenDiv = document.createElement('div');
      screenDiv.className = 'screen';

      const qData = questions[qNum - 1];
      if (!qData) {
        // 兜底
        renderEndingScreen();
        return;
      }

      const textDiv = document.createElement('div');
      textDiv.className = 'story-text';

      // 问题序号
      const indexSpan = document.createElement('span');
      indexSpan.className = 'q-index';
      indexSpan.textContent = `第 ${qNum} / 10 题`;
      textDiv.appendChild(indexSpan);

      // 问题文本
      const qPara = document.createElement('p');
      qPara.textContent = qData.text;
      qPara.style.fontWeight = '500';
      qPara.style.marginBottom = '1.1rem';
      qPara.style.color = '#4a4038';
      qPara.style.whiteSpace = 'pre-wrap';
      qPara.style.fontSize = '1rem';
      qPara.style.lineHeight = '1.6';
      textDiv.appendChild(qPara);

      // 按钮区域
      const btnArea = document.createElement('div');
      btnArea.className = 'buttons-area';

      qData.options.forEach((opt) => {
        const btn = document.createElement('button');
        // 标签字母
        const tagSpan = document.createElement('span');
        tagSpan.className = 'opt-tag';
        const letter = opt.label.trim().charAt(0);
        tagSpan.textContent = letter;

        // 文字部分
        const btnText = document.createTextNode(opt.label.replace(/^[A-Z]\s*/, ''));

        btn.appendChild(tagSpan);
        btn.appendChild(btnText);

        btn.addEventListener('click', () => {
          handleOptionClick(opt.score);
        });

        btnArea.appendChild(btn);
      });

      // 添加回退按钮（如果当前题不是第一题，或者第一题也可以回退到输入页）
      const backBtn = document.createElement('button');
      backBtn.className = 'btn-back';
      backBtn.textContent = qNum === 1 ? '← 返回修改代号' : '← 返回上一题';
      backBtn.addEventListener('click', () => {
        goBack();
      });
      btnArea.appendChild(backBtn);

      screenDiv.appendChild(textDiv);
      screenDiv.appendChild(btnArea);
      container.appendChild(screenDiv);
    }

    // --------------------------------------------------------------
    // 渲染：结局界面
    // --------------------------------------------------------------
    function renderEndingScreen() {
      const endingKey = getEndingKey(totalScore);
      const ending = endings[endingKey];

      const screenDiv = document.createElement('div');
      screenDiv.className = 'screen';

      // 结局标题
      const titleDiv = document.createElement('div');
      titleDiv.className = 'ending-title';
      titleDiv.textContent = ending.title;

      const subDiv = document.createElement('div');
      subDiv.className = 'ending-sub';
      subDiv.innerHTML = `${playerName}大人 · 综合评分 ${totalScore} / 20`;

      // 正文
      const textDiv = document.createElement('div');
      textDiv.className = 'story-text';

      ending.paragraphs.forEach(para => {
        const p = document.createElement('p');
        // 替换「代号」为玩家代号
        const processed = para.replace(/「代号」/g, playerName);
        p.textContent = processed;
        textDiv.appendChild(p);
      });

      // 主办方落款
      const orgP = document.createElement('p');
      orgP.className = 'org-name';
      orgP.textContent = `—— ${ORG_NAME} ——`;
      textDiv.appendChild(orgP);

      // 重新开始按钮
      const btnArea = document.createElement('div');
      btnArea.className = 'buttons-area';

      const restartBtn = document.createElement('button');
      restartBtn.className = 'btn-center restart-btn';
      restartBtn.textContent = '重新认证';
      restartBtn.addEventListener('click', () => {
        resetGame();
      });

      btnArea.appendChild(restartBtn);

      screenDiv.appendChild(titleDiv);
      screenDiv.appendChild(subDiv);
      screenDiv.appendChild(textDiv);
      screenDiv.appendChild(btnArea);
      container.appendChild(screenDiv);

      console.log(`认证结束 | 代号:${playerName} | 总分:${totalScore} | 结局:${endingKey}「${ending.title}」`);
    }

    // --------------------------------------------------------------
    // 初始化
    // --------------------------------------------------------------
    render();

  })();
</script>

<!-- 操作说明（隐藏备注）
     1. 手机浏览器打开本文件，显示认证标题页（米白调查问卷风格）。
     2. 点击「开始认证」阅读开场说明。
     3. 点击「登记代号」，在输入框中输入您想要的代号（如：朝雾），点击「确认代号」。
     4. 之后系统将以「XX大人」称呼您，主办方为「时之政府远征事务处理办公室」。
     5. 依次回答十道问卷题，每题选择A/B/C/D，自动累积分数并进入下一题。
     6. 每道题下方有「返回上一题」按钮，可回退重新作答（回退后该题分数清零，可重新选择）。
        在第一题时可返回修改代号。
     7. 十题答完后，根据总分（-10~20）显示四个结局之一：
        A 不予通过（-10~0）
        B 冷却期后重新申请（0~11，0分归入A处理）
        C 前往刀剑男士考试场参与申请（12~16）—— 内含“总要有一方靠谱吧”
        D 批准通过（17~20）
     8. 结局页点击「重新认证」即可从头再玩。
     9. 所有按钮高度≥48px，字号≥16px，适合触屏。
-->
